<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Arbodiem (Günün Ağacı): görev, not, takvim ve alarm uygulaması.">
<meta name="theme-color" content="#0A0F1C">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arbodiem">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Arbodiem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sora:wght@600;700&display=swap">
<style>
/* Layout: telefonda tek sütun + alt sekme çubuğu; masaüstünde sabit sol menü + iki sütunlu çalışma alanı */
:root{
  color-scheme: dark;
  --bg:#0A0F1C; --surface:#121A2B; --surface-2:#1A2438; --surface-3:#0F1626; --side:#0E1424;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --fg:#F3F6FB; --soft:#CBD5E1; --muted:#94A3B8; --faint:#64748B;
  --accent:#22C55E; --accent-2:#0EA5E9; --on-accent:#06111F;
  --violet:#A78BFA; --sky:#38BDF8; --sun:#FBBF24; --leaf:#4ADE80; --coral:#FB7185; --pink:#F472B6;
  --coral-text:#FDA4AF; --sun-text:#FDE68A; --violet-text:#C4B5FD; --sky-text:#7DD3FC; --leaf-text:#86EFAC;
  --display:'Sora',ui-sans-serif,system-ui,sans-serif;
  --body:'Manrope',ui-sans-serif,system-ui,sans-serif;
  --r-sm:12px; --r:18px; --r-lg:24px;
  --tabbar:rgba(14,20,36,.96); --rest:rgba(18,26,43,.85); --grab:rgba(255,255,255,.35); --ring-text:#F3F6FB;
}
:root[data-mode="light"]{
  color-scheme: light;
  --bg:#F4F7FB; --surface:#FFFFFF; --surface-2:#EDF1F7; --surface-3:#F7F9FC; --side:#FFFFFF;
  --line:rgba(15,23,42,.08); --line-2:rgba(15,23,42,.15);
  --fg:#0F172A; --soft:#334155; --muted:#5B6B82; --faint:#94A3B8;
  --coral-text:#BE123C; --sun-text:#92400E; --violet-text:#6D28D9; --sky-text:#0369A1; --leaf-text:#15803D;
  --tabbar:rgba(255,255,255,.96); --rest:rgba(226,232,240,.9); --grab:rgba(15,23,42,.18); --ring-text:#0F172A;
}
:root[data-mode="light"] .chip,:root[data-mode="light"] .stats3 b{color:color-mix(in srgb,var(--c,#64748B) 62%,#0F172A)}
:root[data-mode="light"] .card,:root[data-mode="light"] .task,:root[data-mode="light"] .stat,:root[data-mode="light"] .set-group,:root[data-mode="light"] .note-list,:root[data-mode="light"] .pinned,:root[data-mode="light"] .step,:root[data-mode="light"] .feat{box-shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.05)}
:root[data-mode="light"] .clock{background:linear-gradient(135deg,rgba(99,102,241,.16),rgba(14,165,233,.08) 55%,#FFFFFF 100%);border-color:rgba(99,102,241,.22)}
:root[data-mode="light"] .clock .pills span{background:rgba(15,23,42,.06)}
:root[data-mode="light"] .tree-card{background:radial-gradient(120% 90% at 50% 0%,rgba(34,197,94,.14),transparent 60%),#FFFFFF}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ---------- Kabuk ---------- */
.app{min-height:100%}
.side{display:none}
.main{max-width:600px;margin:0 auto;padding:18px 16px 112px;display:flex;flex-direction:column;gap:16px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--tabbar);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border:0;background:none;border-radius:14px;color:var(--muted);font-size:11px;font-weight:700}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--tc);background:color-mix(in srgb,var(--tc) 15%,transparent);font-weight:800}

@media (min-width:960px){
  .app{display:grid;grid-template-columns:252px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:24px 16px;background:var(--side);border-right:1px solid var(--line)}
  .tabbar{display:none}
  .main{max-width:1180px;width:100%;padding:28px 36px 48px}
  .m-only{display:none!important}
}
.side-brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
.side-brand b{font-family:var(--display);font-size:20px;letter-spacing:-.02em;display:block}
.side-brand small{color:var(--muted);font-size:12px;font-weight:700}
.side-link{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border:0;border-radius:14px;background:none;color:var(--soft);font-size:14px;font-weight:700;text-align:left}
.side-link svg{width:20px;height:20px;color:var(--tc)}
.side-link:hover{background:var(--surface)}
.side-link[aria-current="page"]{background:color-mix(in srgb,var(--tc) 15%,transparent);color:var(--tc);font-weight:800}
.side-link .count{margin-left:auto;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--tc);color:var(--on-accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--surface)}
.who b{font-size:13px;display:block}.who small{font-size:11px;color:var(--muted);font-weight:600}

/* ---------- Ortak parçalar ---------- */
.page-head{display:flex;align-items:center;gap:12px}
.page-head .grow{flex:1;min-width:0}
.eyebrow{font-size:13px;font-weight:700;color:var(--muted)}
.page-head h1{font-size:30px;line-height:1.1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head h2{font-size:16px}
.label{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.link{border:0;background:none;padding:6px 0;font-size:13px;font-weight:800;color:var(--sky)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;
  background:color-mix(in srgb,var(--c,#94A3B8) 18%,transparent);color:var(--t,var(--soft))}
.chip svg{width:11px;height:11px}
.avatar{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:linear-gradient(135deg,var(--leaf),var(--sky));display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:17px;color:var(--on-accent)}
.icon-btn{width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--fg);padding:0}
.icon-btn svg{width:20px;height:20px}
.btn{height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent)}
.btn-danger{background:color-mix(in srgb,var(--coral) 14%,transparent);border-color:color-mix(in srgb,var(--coral) 55%,transparent);color:var(--coral-text)}
.btn-block{width:100%}
.btn svg{width:18px;height:18px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface)}
.seg button{flex:1;height:36px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:13px;font-weight:700;padding:0 12px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:800}
.two{display:grid;gap:16px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:960px){.two{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-weight:600;border:1px dashed var(--line-2);border-radius:var(--r)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:800;color:var(--muted)}
.input,.field input,.field select,.field textarea{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-3);color:var(--fg);font-weight:600}
.field textarea{padding:12px 14px;min-height:96px;resize:vertical}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

/* ---------- Bugün ---------- */
.sample-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--sky) 10%,transparent);border:1px solid color-mix(in srgb,var(--sky) 30%,transparent);font-size:13px;font-weight:700;color:var(--sky-text)}
.sample-bar span{flex:1}
.clock{padding:16px 18px 12px;border-radius:var(--r-lg);background:linear-gradient(135deg,rgba(79,70,229,.26),rgba(14,165,233,.08) 55%,var(--surface) 100%);border:1px solid rgba(129,140,248,.26);display:flex;flex-direction:column;gap:12px}
.clock-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.clock .time{font-family:var(--display);font-size:36px;font-weight:600;letter-spacing:-.03em;line-height:1}
.clock .time small{font-size:15px;color:var(--muted);margin-left:3px;letter-spacing:0}
.clock .date{font-size:13px;font-weight:700;color:var(--soft);margin-top:7px}
.clock .date span{color:var(--muted)}
.clock .pills{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.clock .pills span{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.07);font-size:12px;font-weight:800;color:var(--soft)}
.clock .pills i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.daybar{position:relative;height:6px;border-radius:4px;background:linear-gradient(90deg,#312E81 0%,#6366F1 22%,#38BDF8 40%,#FBBF24 62%,#F472B6 80%,#312E81 100%)}
.daybar .rest{position:absolute;top:0;bottom:0;right:0;border-radius:0 4px 4px 0;background:var(--rest)}
.daybar .sun{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#FDE047;box-shadow:0 0 0 4px rgba(253,224,71,.22),0 0 14px rgba(253,224,71,.65)}
.daylabels{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.menu{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--surface-3)}
.menu button{display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;border:0;background:none;font-weight:700;font-size:15px;text-align:left}
.menu button:hover{background:var(--surface-2)}
.menu button + button{border-top:1px solid var(--line)}
.menu svg{width:20px;height:20px;color:var(--muted);flex:none}
.menu .danger,.menu .danger svg{color:var(--coral-text)}
.report{--paper:#F8FAFC;--ink:#0F172A;--ink-soft:#475569;--rule:#E2E8F0;background:var(--paper);color:var(--ink);border-radius:20px;padding:24px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.report h2{font-size:24px;color:var(--ink)}
.rep-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.rep-brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:16px}
.rep-date{font-size:12px;font-weight:700;color:var(--ink-soft)}
.rep-sub{font-size:14px;font-weight:600;color:var(--ink-soft);margin-top:-8px}
.rep-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:540px){.rep-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rep-kpi div{padding:12px;border-radius:12px;background:#fff;border:1px solid var(--rule)}
.rep-kpi b{display:block;font-family:var(--display);font-size:24px;color:var(--k)}
.rep-kpi small{font-size:12px;font-weight:700;color:var(--ink-soft)}
.report h3{font-family:var(--body);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px}
.rep-scroll{overflow-x:auto}
.rep-table{width:100%;border-collapse:collapse;font-size:14px}
.rep-table th{text-align:left;font-size:12px;color:var(--ink-soft);font-weight:800;padding:6px 8px;border-bottom:1px solid var(--rule)}
.rep-table td{padding:8px;border-bottom:1px solid var(--rule);font-weight:600;color:var(--ink)}
.rep-bar{height:8px;border-radius:4px;background:var(--rule);overflow:hidden;min-width:80px}
.rep-bar i{display:block;height:100%;background:var(--k)}
.rep-day b{display:block;font-size:14px;margin-bottom:2px}
.rep-day ul,.rep-list{margin:0;padding-left:18px;font-size:14px;line-height:1.65;color:#1E293B}
.rep-tag{font-size:12px;font-weight:800;color:var(--k)}
.rep-empty{font-size:14px;color:var(--ink-soft);font-weight:600}
.dl-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.dl-row .label{margin-right:4px}
.dl-row .btn{height:42px;flex:1 1 110px;border-color:color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent)}
.dl-row .btn svg{color:var(--c)}
.copy-box{width:100%;min-height:50vh;padding:12px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-3);color:var(--fg);font:500 13px/1.6 ui-monospace,Menlo,Consolas,monospace}
.stat-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);min-width:0}
.stat b{font-size:14px;display:block}.stat small{font-size:12px;font-weight:600;color:var(--muted)}
.stat.late{background:linear-gradient(150deg,color-mix(in srgb,var(--coral) 24%,transparent),var(--surface) 75%);border-color:color-mix(in srgb,var(--coral) 30%,transparent)}
.stat .big{width:54px;height:54px;flex:none;border-radius:16px;background:color-mix(in srgb,var(--coral) 20%,transparent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:26px;font-weight:700;color:var(--coral-text)}
.stat.late small{color:var(--coral-text)}
.quick{display:flex;flex-direction:column;gap:10px}
.quick-row{display:flex;gap:10px}
.quick-row input{flex:1;min-width:0;height:52px;padding:0 16px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface-3);color:var(--fg);font-weight:600}
.btn-add{width:52px;height:52px;flex:none;border:0;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.btn-add svg{width:24px;height:24px}
.quick-preview{display:flex;flex-wrap:wrap;gap:6px;min-height:22px;font-size:12px;font-weight:600;color:var(--muted)}
.quick-preview .chip{font-size:12px;padding:3px 10px}
.list-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.list-head h2{font-size:18px}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.task.is-late{border-color:color-mix(in srgb,var(--coral) 45%,transparent)}
.task.is-done{background:var(--surface-3)}
.check{width:28px;height:28px;flex:none;border-radius:50%;border:2.5px solid var(--c);background:none;display:flex;align-items:center;justify-content:center;padding:0;color:var(--on-accent)}
.task.is-late .check{border-color:var(--coral)}
.task.is-done .check{background:var(--accent);border-color:var(--accent)}
.check svg{width:15px;height:15px}
.task-body{flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 0;display:flex;flex-direction:column;gap:5px}
.task-title{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.task.is-done .task-title{color:var(--muted);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.task-side{display:flex;align-items:center;gap:6px}
.time-pill{padding:6px 10px;border-radius:12px;background:var(--surface-2);font-family:var(--display);font-size:12px;font-weight:600}
.task.is-late .time-pill{background:color-mix(in srgb,var(--coral) 18%,transparent);color:var(--coral-text)}
.task.is-done .time-pill{background:none;color:var(--muted)}
.defer{width:36px;height:36px;border-radius:11px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.defer:hover{background:var(--surface-2);color:var(--fg)}
.defer svg{width:18px;height:18px}
.list-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tree-card{text-align:center;background:radial-gradient(120% 90% at 50% 0%,rgba(34,197,94,.16),transparent 60%),var(--surface)}
.tree-card svg.tree{width:100%;max-width:240px;height:auto;display:block;margin:0 auto}
.tree-card .stage{font-family:var(--display);font-size:18px;font-weight:700;margin-top:4px}
.tree-card .stage-sub{font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
.bar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--leaf),var(--sun))}
.close-card{background:linear-gradient(150deg,color-mix(in srgb,var(--violet) 22%,transparent),var(--surface) 70%);border-color:color-mix(in srgb,var(--violet) 28%,transparent)}
.close-card p{font-size:13px;font-weight:600;color:var(--soft);margin:4px 0 12px}
.alarm-list{display:flex;flex-direction:column;gap:8px}
.alarm-item{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.alarm-item .t{padding:5px 9px;border-radius:10px;background:var(--sun);color:#3B2A00;font-family:var(--display);font-size:12px}

/* ---------- Takvim ---------- */
.cal{padding:14px 10px 10px}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.cal-wd{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);padding-bottom:8px}
.cal-wd span:nth-child(n+6){color:var(--coral-text)}
.cal-grid{row-gap:4px}
.day{height:48px;margin:0 2px;border:0;border-radius:14px;background:none;font-family:var(--display);font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;color:var(--fg)}
.day.we{color:var(--coral-text)}
.day.out{visibility:hidden}
.day.today{box-shadow:inset 0 0 0 1.5px var(--line-2)}
.day[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.day[aria-pressed="true"] .dots i{background:var(--on-accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend .chip{font-size:12px;padding:5px 11px}
.legend .chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
@media (min-width:960px){.cal-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}}

/* ---------- Notlar ---------- */
.folders{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.folders button{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--soft);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.folders button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.folders button small{font-size:11px;color:var(--muted)}
.folders button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.folders button[aria-pressed="true"] small{color:#475569}
.search{position:relative}
.search svg{position:absolute;left:15px;top:15px;width:20px;height:20px;color:var(--muted)}
.search input{width:100%;height:50px;padding:0 16px 0 46px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600}
.pinned-open{display:block;width:100%;border:0;background:none;text-align:left;padding:0;color:inherit}
.note-item{display:flex;align-items:center;padding-right:8px}
.note-item + .note-item{border-top:1px solid var(--line)}
.note-item .note-row{flex:1;min-width:0}
.pinned{display:block;width:100%;text-align:left;padding:16px;border-radius:22px;background:var(--surface);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.pinned + .pinned{margin-top:10px}
.pinned .top{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.fold-ic{width:30px;height:30px;flex:none;border-radius:10px;background:var(--c);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.fold-ic svg{width:16px;height:16px}
.pinned h3{font-size:18px;margin-top:12px}
.pinned p{font-size:13px;font-weight:600;color:var(--soft);line-height:1.55;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.note-list{border-radius:22px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.note-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:none;text-align:left}
.note-row:hover{background:var(--surface-2)}
.note-ic{width:40px;height:40px;flex:none;border-radius:12px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);display:flex;align-items:center;justify-content:center}
.note-ic svg{width:20px;height:20px}
.note-row .txt{flex:1;min-width:0}
.note-row b{font-size:14px;display:block}
.note-row span{display:block;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.note-row time{font-size:12px;font-weight:700;color:var(--muted)}
.fab{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:15;width:58px;height:58px;border:0;border-radius:20px;background:linear-gradient(135deg,#EC4899,#8B5CF6);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px rgba(139,92,246,.45)}
.fab svg{width:26px;height:26px}
@media (min-width:960px){.fab{bottom:32px;right:36px}}

/* ---------- Arşiv ---------- */
.months{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.months button{flex:none;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:700}
.years button{font-family:var(--display);font-weight:600}
.year-row{display:grid;grid-template-columns:76px minmax(0,1fr) 40px;align-items:center;gap:12px;width:100%;padding:13px 14px;border:0;background:none;text-align:left;font-weight:700;font-size:14px}
.year-row + .year-row{border-top:1px solid var(--line)}
.year-row:hover{background:var(--surface-2)}
.year-row .bar{margin:0}
.year-row .num{text-align:right;color:var(--soft)}
.months button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:800}
.month-hero{position:relative;overflow:hidden;padding:18px 20px;border-radius:var(--r-lg);background:linear-gradient(135deg,#15803D 0%,#0D9488 50%,#0369A1 100%);color:#fff}
.month-hero .n{font-family:var(--display);font-size:46px;font-weight:700;letter-spacing:-.04em;line-height:1.05;margin-top:4px}
.stack{display:flex;gap:3px;height:10px;margin-top:16px}
.stack span{border-radius:6px}
.stack-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11px;font-weight:800}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats3 div{padding:12px;border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,transparent),var(--surface) 80%)}
.stats3 b{display:block;font-family:var(--display);font-size:21px;color:var(--t)}
.stats3 small{font-size:11px;font-weight:700;color:var(--soft)}
.forest{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.forest button{flex:none;width:86px;padding:8px 6px;border-radius:16px;border:1px solid var(--line);background:var(--surface-3);text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.forest button[aria-pressed="true"]{border-color:var(--leaf);color:var(--leaf-text)}
.forest svg{width:70px;height:70px;display:block;margin:0 auto}
.day-group{display:flex;flex-direction:column;gap:8px}
.day-group h3{font-family:var(--body);font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:6px}
.closing{padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--violet) 10%,transparent);font-size:13px;font-weight:600;color:var(--violet-text)}

/* ---------- Profil ---------- */
.profile{position:relative;overflow:hidden;padding:18px;border-radius:var(--r-lg);background:linear-gradient(135deg,#7C3AED 0%,#4F46E5 45%,#0369A1 100%);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 78%,#1E1B4B) 0%,color-mix(in srgb,var(--accent) 45%,var(--accent-2)) 50%,color-mix(in srgb,var(--accent-2) 72%,#0B1220) 100%);color:#fff;transition:background .2s}
.profile h2,.profile p,.profile .pills span{text-shadow:0 1px 2px rgba(0,0,0,.25)}
.profile .row{display:flex;align-items:center;gap:14px}
.profile .avatar{width:56px;height:56px;border:3px solid rgba(255,255,255,.8);font-size:22px}
.profile h2{font-size:19px}
.profile .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.profile .pills span{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.2);font-size:12px;font-weight:800}
.set-group{border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.set{display:flex;align-items:center;gap:14px;padding:11px 14px;min-height:60px}
.set + .set{border-top:1px solid var(--line)}
.set .ic{width:38px;height:38px;flex:none;border-radius:12px;background:var(--c);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.set .ic svg{width:20px;height:20px}
.set .txt{flex:1;min-width:0;font-size:15px;font-weight:700}
.set .txt small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.set select,.set input[type=time]{height:38px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);padding:0 10px;font-weight:700}
.switch{width:52px;height:30px;flex:none;border-radius:15px;border:0;background:var(--surface-2);position:relative;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:25px}
.swatches{display:flex;gap:7px}
.swatches button{width:26px;height:26px;border-radius:50%;border:0;padding:0;background:var(--c)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}

/* ---------- Katman, sayfa, bildirim ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(3,6,14,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:26px;padding-bottom:22px}}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet-head h2{flex:1;font-size:20px}
.sheet-actions{display:flex;flex-wrap:wrap;gap:10px}
.sheet-actions .btn{flex:1 1 140px}
.moods{display:flex;gap:8px}
.moods button{flex:1;height:44px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);font-weight:800;font-size:13px;color:var(--soft)}
.moods button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.carry{display:flex;flex-direction:column;gap:6px}
.carry label{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-3);font-size:14px;font-weight:600}
.carry input{width:18px;height:18px;accent-color:var(--accent)}
.editor{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column}
.editor-bar{display:flex;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line)}
.editor-bar .grow{flex:1}
.editor-bar select{height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 12px;font-weight:700}
.editor-body{flex:1;overflow:auto;width:100%;max-width:760px;margin:0 auto;padding:22px 20px 30px;display:flex;flex-direction:column;gap:12px}
.editor-body input{border:0;background:none;font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--fg);padding:0}
.editor-body textarea{flex:1;min-height:55vh;border:0;background:none;resize:none;font-size:16px;line-height:1.7;color:var(--soft);padding:0;font-weight:500}
.editor-body input:focus,.editor-body textarea:focus{outline:none}
.editor-foot{display:flex;align-items:center;gap:6px;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.editor-foot i{width:7px;height:7px;border-radius:50%;background:var(--leaf)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);padding:12px 18px;border-radius:14px;background:var(--fg);color:var(--bg);font-weight:800;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
@media (min-width:960px){.toast{bottom:32px}}
.alarm-banner{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:70;width:calc(100% - 24px);max-width:460px;padding:14px;border-radius:20px;background:#1F1A0B;border:1px solid var(--sun);box-shadow:0 18px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px}
.alarm-banner .row{display:flex;align-items:center;gap:12px}
.alarm-banner .ring{width:44px;height:44px;flex:none;border-radius:14px;background:var(--sun);color:#3B2A00;display:flex;align-items:center;justify-content:center}
.alarm-banner .ring svg{width:24px;height:24px}
.alarm-banner small{font-size:12px;font-weight:800;color:var(--sun-text)}
.alarm-banner b{display:block;font-size:15px}
.alarm-banner .acts{display:flex;gap:8px}
.alarm-banner .acts .btn{flex:1;height:40px;font-size:13px}
@media (prefers-reduced-motion:no-preference){
  .sun-rays{transform-origin:170px 30px;animation:spin 48s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ring{animation:shake 1s ease-in-out infinite}
  @keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}}
}

/* ---------- Giriş: tek parça, sabit ---------- */
.login-note{text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.form-error{font-size:13px;font-weight:700;color:var(--coral-text)}
.forgot{align-self:flex-end;border:0;background:none;padding:2px 0;font-size:13px;font-weight:800;color:var(--sky)}
.login{position:relative;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 20px;overflow:hidden;color:#fff;background:linear-gradient(160deg,#15803D 0%,#0D9488 38%,#0369A1 72%,#4F46E5 100%)}
.login::before{content:"";position:absolute;right:-90px;top:-80px;width:280px;height:280px;border-radius:50%;background:rgba(253,224,71,.16)}
.login::after{content:"";position:absolute;left:-110px;bottom:-120px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.07)}
.login-in{position:relative;z-index:1;width:100%;max-width:420px;display:flex;flex-direction:column;gap:20px}
.login-brand{display:flex;align-items:center;gap:14px}
.logo-box{width:72px;height:72px;flex:none;border-radius:18px;box-shadow:0 0 0 3px rgba(255,255,255,.35),0 14px 30px rgba(0,0,0,.3)}
.brand-name{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;margin:0}
.brand-name small{font-family:var(--body);font-size:14px;letter-spacing:0;font-weight:700;opacity:.9}
.login .slogan{font-size:15px;font-weight:700;margin-top:6px;opacity:.95}
.login-form{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:24px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 20px 40px rgba(2,6,23,.22)}
.login .seg{background:rgba(255,255,255,.14)}
.login .seg button{color:rgba(255,255,255,.88)}
.login .seg button[aria-pressed="true"]{background:#fff;color:#065F46}
.login .field label{color:rgba(255,255,255,.92)}
.login .field input{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);color:#fff}
.login .field input::placeholder{color:rgba(255,255,255,.72)}
.login .field input:focus{outline:none;border-color:#fff;background:rgba(255,255,255,.24)}
.login .btn-primary{background:#fff;color:#065F46;box-shadow:0 10px 24px rgba(2,6,23,.2)}
.login .forgot{color:#fff;text-decoration:underline;text-underline-offset:3px}
.login .form-error{color:#fff;background:rgba(190,18,60,.6);padding:8px 12px;border-radius:12px}
.login .login-note{color:rgba(255,255,255,.88)}
.login .install-link{border-color:rgba(255,255,255,.5);color:#fff}
.login .install-link svg{color:#fff}
.login :focus-visible{outline-color:#fff}

/* ---------- Yükleme ---------- */
.install-link{height:48px;border-radius:14px;border:1px dashed var(--line-2);background:none;color:var(--soft);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.install-link svg{width:18px;height:18px;color:var(--sky)}
.install-banner{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:18px;background:linear-gradient(120deg,rgba(21,128,61,.28),rgba(3,105,161,.22));border:1px solid rgba(74,222,128,.3)}
.install-banner .grow{flex:1;min-width:0}
.install-banner b{display:block;font-size:14px}
.install-banner small{display:block;font-size:12px;font-weight:600;color:var(--soft);margin-top:2px}
.ib-ic{width:44px;height:44px;flex:none;border-radius:10px;box-shadow:0 6px 14px rgba(0,0,0,.3)}
@media (max-width:420px){.install-banner small{display:none}}
.inst-body{max-width:820px;gap:16px}
.inst-body > *{flex-shrink:0}
.inst-hero{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;gap:18px 20px;align-items:center;padding:22px;border-radius:28px;background:linear-gradient(150deg,rgba(21,128,61,.38),rgba(13,148,136,.22) 40%,rgba(3,105,161,.22) 70%,rgba(79,70,229,.24)),var(--surface);border:1px solid var(--line-2)}
.inst-hero::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(253,224,71,.12);pointer-events:none}
.inst-hero > *{position:relative}
.inst-icon{width:104px;height:104px;flex:none;border-radius:24px;box-shadow:0 0 0 4px rgba(255,255,255,.18),0 18px 40px rgba(0,0,0,.45)}
.inst-info{flex:1 1 260px;min-width:0}
.inst-info h1{font-size:32px;line-height:1.05}
.inst-info p{color:var(--soft);font-weight:700;font-size:14px;margin-top:6px}
.inst-meta{display:flex;flex-wrap:wrap;row-gap:10px;margin-top:14px}
.inst-meta span{display:flex;flex-direction:column;padding:0 14px;border-left:1px solid var(--line-2)}
.inst-meta span:first-child{padding-left:0;border-left:0}
.inst-meta b{font-size:14px}
.inst-meta small{font-size:11px;font-weight:700;color:var(--muted);margin-top:2px}
.inst-cta{width:100%;display:flex;flex-wrap:wrap;gap:10px}
.inst-cta .btn{height:56px;font-size:16px;flex:1 1 240px;border-radius:16px}
.inst-cta .btn svg{width:20px;height:20px}
.installed{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:14px;background:rgba(74,222,128,.15);color:var(--leaf-text);font-weight:800}
.installed svg{width:18px;height:18px;padding:3px;border-radius:50%;background:var(--leaf);color:var(--on-accent)}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:color-mix(in srgb,var(--sky) 10%,transparent);border:1px solid color-mix(in srgb,var(--sky) 32%,transparent);color:var(--sky-text);font-weight:600;font-size:14px;line-height:1.5}
.notice svg{width:20px;height:20px;flex:none;margin-top:1px}
.notice b{color:var(--fg)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.step .no{width:34px;height:34px;flex:none;border-radius:50%;background:var(--c);color:var(--on-accent);font-family:var(--display);font-weight:700;display:flex;align-items:center;justify-content:center}
.step > div{flex:1;min-width:0}
.step b{display:block;font-size:15px}
.step p{font-size:14px;color:var(--soft);font-weight:600;margin-top:4px;line-height:1.5}
.step p b{display:inline;color:var(--fg);font-size:inherit}
.step .ill{width:52px;height:52px;flex:none;border-radius:16px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);display:flex;align-items:center;justify-content:center}
.step .ill svg{width:26px;height:26px}
.feats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.feats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.feat{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.feat .fi{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.feat .fi svg{width:20px;height:20px}
.feat b{font-size:14px}
.feat small{font-size:12px;font-weight:600;color:var(--muted)}

/* ---------- Telefonda masaüstü görünümü ---------- */
html.desk .app{display:grid;grid-template-columns:252px minmax(0,1fr);width:1280px}
html.desk .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:calc(100vh / var(--dz,1));padding:24px 16px;background:var(--side);border-right:1px solid var(--line)}
html.desk .tabbar{display:none}
html.desk .main{max-width:1180px;width:100%;padding:28px 36px 48px}
html.desk .m-only{display:none!important}
html.desk .two{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
html.desk .cal-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
html.desk .fab{bottom:32px;right:36px}
html.desk .toast{bottom:32px}
html.desk .feats{grid-template-columns:repeat(4,minmax(0,1fr))}
html.desk .install-banner small{display:block}
html.desk body{overflow:hidden}
html.desk #root{position:fixed;inset:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
html.desk .app{zoom:var(--dz,1)}
#overlay:not(:empty) ~ .dzoom{display:none}

.dzoom .fit{font-size:13px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent)}
.dzoom span{min-width:52px;text-align:center;font-size:13px;font-weight:800;color:var(--soft);font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function nextWd(wd, from){ const d=new Date(from||new Date()); d.setHours(0,0,0,0); const diff=(wd-d.getDay()+7)%7; return addDays(d,diff); }
function nextRepeat(t){

  const last = new Date(y,m+1,0).getDate(); return ymd(new Date(y,m,Math.min(md,last)));

function sortTasks(a,b){
  if(a.done!==b.done) return a.done ? 1 : -1;
  if(a.date!==b.date) return a.date < b.date ? -1 : 1;
  return (a.time||'99') < (b.time||'99') ? -1 : 1;
}
function weekBounds(offset){
  const T=new Date(); T.setHours(0,0,0,0);
  const mon = addDays(T, -((T.getDay()+6)%7) + offset*7);

/* ================= Akıllı hızlı ekleme ================= */
const WDS = [['pazartesi',1],['salı',2],['sali',2],['çarşamba',3],['carsamba',3],['perşembe',4],['persembe',4],['cumartesi',6],['cuma',5],['pazar',0]];
const WD_RE = WDS.map(w=>w[0]).join('|');
const AY_RE = AYLAR.map(lowTr).join('|');
const SUF = "(?:'?(?:de|da|te|ta|a|e|ya|ye|ı|i|u|ü|nda|nde|günü|gunu))?";
function parseQuick(raw){
  let txt = ' '+raw+' ', low = lowTr(txt);
  const T = new Date(); T.setHours(0,0,0,0);
  let date=null, time='', alarm='', cat=null, repeat=null;
  const strip = re => { const m = low.match(re); if(m){ const i=m.index, L=m[0].length; txt = txt.slice(0,i)+' '+txt.slice(i+L); low = low.slice(0,i)+' '+low.slice(i+L); } return m; };
  const wdNum = w => { const f = WDS.find(x=>x[0]===w); return f ? f[1] : null; };
  let m;
  if((m = strip(/\s(?:alarm|hatırlat|hatirlat)\s*(\d{1,2})[:.](\d{2})(?=\s)/))) alarm = pad(+m[1])+':'+m[2];
  if((m = strip(/\s#(denetim|iş|is|sınav|sinav|ders|kişisel|kisisel)(?=\s)/))){
    cat = {denetim:'denetim','iş':'is',is:'is','sınav':'sinav',sinav:'sinav',ders:'sinav','kişisel':'kisisel',kisisel:'kisisel'}[m[1]];
  }
  if((m = strip(/\sher\s+gün(?=\s)/))) repeat = {type:'daily'};
  else if((m = strip(new RegExp('\\sher\\s+('+WD_RE+')'+SUF+'(?=\\s)')))){ const w=wdNum(m[1]); repeat={type:'weekly',wd:w}; date = nextWd(w,T); }
  else if((m = strip(/\sher\s+hafta(?=\s)/))) repeat = {type:'weekly'};
  else if((m = strip(/\sher\s+ay(?:ın|in)?\s+(\d{1,2})(?:'?\S*)?(?=\s)/))){ const md=Math.min(31,+m[1]); repeat={type:'monthly',md}; let d=new Date(T.getFullYear(),T.getMonth(),md); if(d<T) d=new Date(T.getFullYear(),T.getMonth()+1,md); date=d; }
  else if((m = strip(/\sher\s+ay(?=\s)/))) repeat = {type:'monthly'};
  if(!date){
    if(strip(/\s(?:öbür|obur|ertesi)\s+gün(?=\s)/)) date = addDays(T,2);
    else if(strip(/\syarın(?:a|ki)?(?=\s)/) || strip(/\syarin(?=\s)/)) date = addDays(T,1);
    else if(strip(/\sbugün(?:e|kü)?(?=\s)/)) date = T;
    else if(strip(/\shaftaya(?=\s)/)) date = addDays(T,7);
    else if((m = strip(new RegExp('\\s(\\d{1,2})\\s+('+AY_RE+')'+SUF+'(?=\\s)')))){ const mi = AYLAR.map(lowTr).indexOf(m[2]); let d=new Date(T.getFullYear(),mi,+m[1]); if(d<T) d.setFullYear(d.getFullYear()+1); date=d; }
    else if((m = strip(/\s(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?(?=\s)/)) && +m[2]>=1 && +m[2]<=12){ let y = m[3] ? (+m[3]<100 ? 2000+ +m[3] : +m[3]) : T.getFullYear(); date = new Date(y,+m[2]-1,+m[1]); }
    else if((m = strip(new RegExp('\\s('+WD_RE+')'+SUF+'(?=\\s)')))) date = nextWd(wdNum(m[1]),T);
  }
  if((m = strip(/\s(?:saat\s*)?(\d{1,2}):(\d{2})(?:'?(?:de|da|te|ta))?(?=\s)/))) time = pad(Math.min(23,+m[1]))+':'+m[2];
  else if((m = strip(/\ssaat\s*(\d{1,2})(?:'?(?:de|da|te|ta))?(?=\s)/)) || (m = strip(/\s(\d{1,2})'(?:de|da|te|ta)(?=\s)/))){ let hh=+m[1]; if(hh<8) hh+=12; time = pad(Math.min(23,hh))+':00'; }
  if(!cat){
    const l = lowTr(raw);
    if(/denetim|rapor|müdürlük|mudurluk|tespit|mevzuat|tutanak/.test(l)) cat='denetim';
    else if(/sınav|sinav|ders|vize|final|ünite|unite|çalış|calis|test/.test(l)) cat='sinav';
    else if(/nöbet|nobet|toplantı|toplanti|e-posta|mail|ekip|yazı|yazi/.test(l)) cat='is';
    else cat='kisisel';
  }
  if(repeat && repeat.type==='weekly' && repeat.wd==null) repeat.wd = (date||T).getDay();
  if(repeat && repeat.type==='monthly' && !repeat.md) repeat.md = (date||T).getDate();
  if(!date) date = T;
  if(time && !alarm && S.settings.lead) alarm = minusMin(time, S.settings.lead);
  const title = capTr(txt.replace(/\s+/g,' ').trim());
  return {title, date:ymd(date), time, alarm, cat, repeat};
}

function streak(){
  const days = new Set(S.tasks.filter(x=>x.done&&!x.skipped&&x.doneAt).map(x=>ymd(new Date(x.doneAt))));
  let d = new Date(), n = 0; if(!days.has(ymd(d))) d = addDays(d,-1);
  while(days.has(ymd(d))){ n++; d = addDays(d,-1); }
  return n;
}

let deskW = 0, UZ = 1;
const COUNTER = ['overlay','toast','alarm','dzoom'];
function setCounterZoom(){}
function applyDesk(force){
  const de = document.documentElement, want = !!(S.loggedIn && S.settings.desktop);
  if(force || !de.classList.contains('desk')){ de.classList.remove('desk'); document.getElementById('root').style.zoom = ''; deskW = de.clientWidth || window.innerWidth; }
  const dz = document.getElementById('dzoom');
  if(!(want && deskW < 960)){
    de.classList.remove('desk'); document.getElementById('root').style.zoom = ''; de.style.removeProperty('--dz'); delete de.dataset.dzb; UZ = 1;
    setCounterZoom(0); if(dz) dz.hidden = true; return;
  }
  const base = Math.max(0.25, deskW/1280), nz = base*UZ;
  de.dataset.dzb = base; de.classList.add('desk'); de.style.setProperty('--dz', nz);
  setCounterZoom(nz); if(dz) dz.hidden = false; updateZoomLabel();
}
function updateZoomLabel(){ const l = document.getElementById('dzLabel'); if(l) l.textContent = Math.round(UZ*100)+'%'; }
function setDeskZoom(uz, fx, fy){
  const de = document.documentElement; if(!de.classList.contains('desk')) return;
  const base = parseFloat(de.dataset.dzb)||1, old = base*UZ;
  UZ = Math.min(3, Math.max(1, uz)); const nz = base*UZ;
  if(fx==null) fx = window.innerWidth/2; if(fy==null) fy = window.innerHeight/2;
  const sc = document.getElementById('root'), cx = (sc.scrollLeft + fx)/old, cy = (sc.scrollTop + fy)/old;
  de.style.setProperty('--dz', nz); setCounterZoom(nz); updateZoomLabel();
  sc.scrollLeft = Math.max(0, cx*nz - fx); sc.scrollTop = Math.max(0, cy*nz - fy);
}
let pinch = null, pinchRaf = 0;
document.addEventListener('touchstart', e=>{
  if(!document.documentElement.classList.contains('desk') || e.touches.length!==2) return;
  const a = e.touches[0], b = e.touches[1];
  pinch = {d0: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY) || 1, uz0: UZ};
}, {passive:true});
document.addEventListener('touchmove', e=>{
  if(!pinch || e.touches.length!==2) return;
  e.preventDefault();
  const a = e.touches[0], b = e.touches[1], d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
  const fx = (a.clientX+b.clientX)/2, fy = (a.clientY+b.clientY)/2, target = pinch.uz0*d/pinch.d0;
  if(!pinchRaf) pinchRaf = requestAnimationFrame(()=>{ pinchRaf = 0; setDeskZoom(target, fx, fy); });
}, {passive:false});
document.addEventListener('touchend', e=>{ if(e.touches.length<2) pinch = null; });

function periodRange(p){
  const T=new Date(); T.setHours(0,0,0,0);
  if(p==='hafta'){ const w=weekBounds(0); return [w[0],w[1],'Bu hafta']; }
  if(p==='gecenhafta'){ const w=weekBounds(-1); return [w[0],w[1],'Geçen hafta']; }
  if(p==='ay') return [ymd(new Date(T.getFullYear(),T.getMonth(),1)), ymd(new Date(T.getFullYear(),T.getMonth()+1,0)), 'Bu ay'];
  if(p==='yil') return [T.getFullYear()+'-01-01', T.getFullYear()+'-12-31', 'Bu yıl'];
  if(p==='sec'){ const k = UI.archM, y = +k.slice(0,4); if(k.length===4) return [y+'-01-01', y+'-12-31', y+' yılı']; const m = +k.slice(5,7); return [ymd(new Date(y,m-1,1)), ymd(new Date(y,m,0)), AYLAR[m-1]+' '+y]; }
  return [ymd(new Date(T.getFullYear(),T.getMonth()-1,1)), ymd(new Date(T.getFullYear(),T.getMonth(),0)), 'Geçen ay'];
}
function reportData(p){
  const r = periodRange(p), a=r[0], b=r[1], t=todayY(), end = b<t ? b : t, inR = s => s>=a && s<=b;
  const done = S.tasks.filter(x=>x.done && !x.skipped && x.doneAt && inR(ymd(new Date(x.doneAt)))).sort((x,y)=>x.doneAt<y.doneAt?-1:1);
  const planned = S.tasks.filter(x=>x.date>=a && x.date<=end);
  const rate = planned.length ? Math.round(planned.filter(x=>x.done&&!x.skipped).length/planned.length*100) : 0;
  const late = S.tasks.filter(x=>!x.done && x.date>=a && x.date<t).sort(sortTasks);
  const upcoming = S.tasks.filter(x=>!x.done && x.date>=t && x.date<=b).sort(sortTasks);
  const byCat = Object.keys(CATS).map(c=>[c,done.filter(x=>x.cat===c).length]);
  const closings = Object.keys(S.closings).filter(inR).sort().map(k=>[k,S.closings[k]]);
  const groups = {}; done.forEach(x=>{ const k=ymd(new Date(x.doneAt)); (groups[k]=groups[k]||[]).push(x); });
  return {a,b,label:r[2],done,planned,rate,late,upcoming,byCat,closings,groups};

async function hashPw(pw, salt){
  const str = salt+'|'+pw;
  try{ if(window.crypto && crypto.subtle){ const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); } }catch(e){}
  let h = 5381; for(let i=0;i<str.length;i++){ h = ((h<<5)+h+str.charCodeAt(i))|0; } return 'f'+(h>>>0).toString(16);
}
async function setPassword(pw){ const salt = uid()+uid(); S.user.pass = {salt, hash: await hashPw(pw, salt), at: new Date().toISOString()}; }
async function checkPassword(pw){ if(!S.user.pass) return true; return (await hashPw(pw, S.user.pass.salt)) === S.user.pass.hash; }

      '<button data-act="toggle" data-id="'+t.id+'">'+I.check+(t.done?'Tamamlanmadı olarak işaretle':'Tamamlandı olarak işaretle')+'</button>'+
      '<button data-act="dupTask" data-id="'+t.id+'">'+I.copy+'Kopyasını oluştur</button>'+
      '<button class="danger" data-act="delTask" data-id="'+t.id+'" data-step="0">'+I.trash+'Sil</button></div>');
  },
  dupTask: b => { const t = findT(b.dataset.id); if(!t) return; S.tasks.push(Object.assign({}, t, {id:uid(),title:t.title+' (kopya)',done:false,doneAt:null,spawned:false,skipped:false,sample:false})); save(); closeSheet(); render(); toast('Kopyası oluşturuldu'); },
  noteMenu: b => {
    const n = S.notes.find(x=>x.id===b.dataset.id); if(!n) return;
    openSheet('<div class="sheet-head"><h2 style="font-size:17px">'+esc(n.title||'Başlıksız not')+'</h2><button class="icon-btn" data-act="closeSheet" aria-label="Kapat">'+I.close+'</button></div><div class="menu">'+
      '<button data-act="openNote" data-id="'+n.id+'">'+I.notlar+'Düzenle</button>'+
      '<button data-act="pinNoteId" data-id="'+n.id+'">'+I.pin+(n.pinned?'Sabitlemeyi kaldır':'Sabitle')+'</button>'+
      '<button data-act="dupNote" data-id="'+n.id+'">'+I.copy+'Kopyasını oluştur</button>'+
      '<button class="danger" data-act="delNoteId" data-id="'+n.id+'" data-step="0">'+I.trash+'Sil</button></div>');
  },
  pinNoteId: b => { const n = S.notes.find(x=>x.id===b.dataset.id); if(!n) return; n.pinned = !n.pinned; save(); closeSheet(); render(); toast(n.pinned?'Sabitlendi':'Sabitleme kaldırıldı'); },
  dupNote: b => { const n = S.notes.find(x=>x.id===b.dataset.id); if(!n) return; S.notes.push(Object.assign({}, n, {id:uid(),title:(n.title||'Not')+' (kopya)',pinned:false,sample:false,updated:new Date().toISOString()})); save(); closeSheet(); render(); toast('Kopyası oluşturuldu'); },
  delNoteId: b => {
    if(b.dataset.step==='0'){ b.dataset.step='1'; b.innerHTML = I.trash+'Emin misin? Sil'; return; }
    S.notes = S.notes.filter(x=>x.id!==b.dataset.id); save(); closeSheet(); render(); toast('Not silindi');
  },
  install: () => openInstall(),
  instTab: b => openInstall(b.dataset.t),
  instScroll: () => { const el = document.getElementById('instSteps'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); },
  doInstall: () => { const ev = installEvt; if(!ev){ openInstall(); return; } ev.prompt(); (ev.userChoice||Promise.resolve({})).then(c=>{ installEvt = null; toast(c.outcome==='accepted' ? 'Arbodiem yükleniyor…' : 'Yükleme iptal edildi'); if(UI.installOpen) openInstall(); }).catch(()=>{}); },
  hideInstall: () => { try{ localStorage.setItem(KEY+'.instHide','1'); }catch(e){} render(); },
  report: () => { if(UI.view==='arsiv') UI.repP = 'sec'; openReport(); },
  dlReport: b => {
    const R = reportData(UI.repP), base = 'Arbodiem-rapor-'+R.a+'_'+R.b, f = b.dataset.f;
    if(f==='txt') return saveFile(base+'.txt', reportText(R));
    if(f==='html') return saveFile(base+'.html', reportDoc(R));
    b.disabled = true; toast('Excel hazırlanıyor…');
    reportXlsx(R).then(buf=>{ b.disabled=false; saveFile(base+'.xlsx', buf); }, ()=>{ b.disabled=false; toast('Excel hazırlanamadı, bağlantını kontrol et'); });
  },
  repP: b => { UI.repP = b.dataset.p; openReport(); },
  copyReport: () => {
    const txt = reportText(reportData(UI.repP));
    const fallback = () => { openSheet('<div class="sheet-head"><h2>Raporu kopyala</h2><button class="icon-btn" data-act="closeSheet" aria-label="Kapat">'+I.close+'</button></div><p class="stage-sub">Metin seçildi. Kopyalamak için Ctrl+C ya da uzun basıp Kopyala.</p><label class="sr" for="copyBox">Rapor metni</label><textarea class="copy-box" id="copyBox" readonly>'+esc(txt)+'</textarea>'); setTimeout(()=>{ const c=document.getElementById('copyBox'); if(c){ c.focus(); c.select(); } },50); };
    try{ navigator.clipboard.writeText(txt).then(()=>toast('Rapor kopyalandı'), fallback); }catch(e){ fallback(); }
  },
  defer: b => { const t = findT(b.dataset.id); if(!t) return; moveToTomorrow(t); save(); closeSheet(); render(); toast('Yarına devredildi'); },
  deferAll: () => { const t=todayY(); const list = S.tasks.filter(x=>!x.done && x.date<=t); list.forEach(moveToTomorrow); save(); render(); toast(list.length+' görev yarına taşındı'); },
  editTask: b => taskSheet(findT(b.dataset.id)),
  newTask: b => taskSheet(null, b.dataset.d),
  delTask: b => {
    if(b.dataset.step==='0'){ b.dataset.step='1'; b.innerHTML = I.trash+'Emin misin? Sil'; return; }
    S.tasks = S.tasks.filter(x=>x.id!==b.dataset.id); save(); closeSheet(); render(); toast('Görev silindi');
  },
  closeSheet: (b,e) => { if(b.dataset.self && e.target!==b) return; closeSheet(); },
  closeDay: () => closeDaySheet(),
  mood: b => { UI.mood = b.dataset.m; b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', String(x===b))); },
  saveClose: () => {
    const t = todayY(); let moved = 0;
    ov.querySelectorAll('[data-carry]').forEach(cb=>{ if(cb.checked){ const x=findT(cb.dataset.carry); if(x){ moveToTomorrow(x); moved++; } } });
    S.closings[t] = {mood:UI.mood, note:(document.getElementById('cdNote')||{}).value||'', at:new Date().toISOString()};
    save(); closeSheet(); render(); toast('Gün kapatıldı'+(moved?' · '+moved+' görev yarına taşındı':''));
  },
  testAlarm: () => { const na = nextAlarms()[0]; showAlarm(na || {title:'Örnek alarm: görevin 15 dakika sonra',alarm:hmNow()}); },
  alarmClose: () => { alarmEl.hidden = true; alarmEl.innerHTML=''; },
  alarmDone: b => { alarmEl.hidden = true; const t=findT(b.dataset.id); if(t && !t.done){ A.toggle({dataset:{id:t.id}}); } },
  snooze: b => { const t=findT(b.dataset.id); alarmEl.hidden = true; if(t){ t.alarm = plusMin(hmNow(),10); save(); render(); toast('10 dakika ertelendi · '+t.alarm); } },
  selDay: b => { UI.selDay = b.dataset.d; render(); },
  cal: b => { let m = UI.calM + +b.dataset.d, y = UI.calY; if(m<0){m=11;y--;} if(m>11){m=0;y++;} UI.calM=m; UI.calY=y; render(); },
  folder: b => { UI.folder = b.dataset.f; render(); },
  newNote: () => openEditor({id:uid(),title:'',body:'',folder:UI.folder==='all'?'is':UI.folder,pinned:false,updated:new Date().toISOString()}),
  openNote: b => { const n = S.notes.find(x=>x.id===b.dataset.id); if(n) openEditor(n); },
  closeNote: () => { saveEditing(); editing = null; closeSheet(); render(); },
  pinNote: b => { if(!editing) return; editing.pinned = !editing.pinned; b.setAttribute('aria-pressed', String(editing.pinned)); b.style.cssText = editing.pinned ? 'color:var(--sun);background:color-mix(in srgb,var(--sun) 16%,transparent)' : ''; saveEditing(); toast(editing.pinned?'Sabitlendi':'Sabitleme kaldırıldı'); },
  delNote: b => {
    if(b.dataset.step==='0'){ b.dataset.step='1'; b.style.cssText='width:auto;padding:0 12px;color:var(--coral-text);border-color:var(--coral)'; b.textContent='Sil?'; return; }
    S.notes = S.notes.filter(x=>x!==editing && x.id!==editing.id); editing = null; save(); closeSheet(); render(); toast('Not silindi');
  },
  archM: b => { UI.archM = b.dataset.m; UI.archQ = ''; render(); },
  archY: b => { UI.archM = b.dataset.y; UI.archQ = ''; render(); },
  notify: b => { S.settings.notify = !S.settings.notify; b.setAttribute('aria-checked', String(S.settings.notify)); save(); try{ if(S.settings.notify && !IN_CLAUDE && 'Notification' in window && Notification.permission==='default') Notification.requestPermission(); }catch(e){} },
  theme: b => { S.settings.theme = b.dataset.t; applyTheme(); markSwatches(); setTimeout(save, 0); },
  lightMode: () => { S.settings.mode = S.settings.mode==='light' ? 'dark' : 'light'; applyTheme(); markSwatches(); setTimeout(save, 0); toast(S.settings.mode==='light' ? 'Beyaz tema açıldı' : 'Koyu temaya dönüldü'); },
  clearSamples: () => { S.tasks = S.tasks.filter(x=>!x.sample); S.notes = S.notes.filter(x=>!x.sample); Object.keys(S.closings).forEach(k=>{ if(S.closings[k].sample) delete S.closings[k]; }); save(); render(); toast('Örnek veriler silindi'); },
  reset: b => {
    if(b.dataset.step==='0'){ b.dataset.step='1'; b.textContent='Emin misin?'; return; }
    const u = S.user; S = seed(); S.user = u; S.loggedIn = true; save(); render(); toast('Baştan başlandı');
  },
  logout: () => { S.loggedIn = false; save(); closeSheet(); UI.loginErr=''; UI.loginTab='giris'; render(); toTop(); },
  loginTab: b => { UI.loginTab = b.dataset.t; UI.loginErr=''; UI.lgUser=''; render(); scrollToForm(true); },
  sheetToggle: () => scrollToForm(),
  dz: b => { const d = +b.dataset.d; setDeskZoom(d===0 ? 1 : UZ + d*0.25); },
  toggleDesktop: () => { S.settings.desktop = !S.settings.desktop; UZ = 1; save(); render(); toTop(); toast(S.settings.desktop ? 'Masaüstü görünümüne geçildi' : 'Mobil görünüme dönüldü'); },
  editAccount: () => openSheet(sheetHead('Hesap bilgileri')+'<form id="accForm" class="col" style="gap:12px" novalidate>'+
    '<div class="field"><label for="acName">Ad soyad</label><input id="acName" autocomplete="name" value="'+esc(S.user.name||'')+'"></div>'+
    '<div class="field"><label for="acUser">Kullanıcı adı</label><input id="acUser" autocomplete="username" autocapitalize="none" value="'+esc(S.user.username||'')+'"></div>'+
    '<p class="form-error" id="acErr" role="alert" hidden></p><div class="sheet-actions"><button class="btn btn-primary">Kaydet</button><button type="button" class="btn" data-act="closeSheet">Vazgeç</button></div></form>'),
  editPass: () => openSheet(sheetHead('Şifreyi değiştir')+'<form id="pwForm" class="col" style="gap:12px" novalidate>'+
    (S.user.pass ? '<div class="field"><label for="pwOld">Mevcut şifre</label><input id="pwOld" type="password" autocomplete="current-password"></div>' : '')+
    '<div class="field"><label for="pwNew">Yeni şifre</label><input id="pwNew" type="password" autocomplete="new-password" placeholder="En az 6 karakter"></div>'+
    '<div class="field"><label for="pwNew2">Yeni şifre (tekrar)</label><input id="pwNew2" type="password" autocomplete="new-password"></div>'+
    '<p class="form-error" id="pwErr" role="alert" hidden></p><div class="sheet-actions"><button class="btn btn-primary">Şifreyi kaydet</button><button type="button" class="btn" data-act="closeSheet">Vazgeç</button></div></form>'),
  forgotPass: () => openSheet(sheetHead('Şifremi unuttum')+'<p style="font-size:14px;font-weight:600;color:var(--soft);line-height:1.55">Bilgilerin yalnızca bu cihazda durduğu için şifre e-postayla sıfırlanamaz. Hesaptaki ad soyadını ve kullanıcı adını doğru yazarsan yeni şifre belirleyebilirsin.</p>'+
    '<form id="fgForm" class="col" style="gap:12px" novalidate>'+
    '<div class="field"><label for="fgName">Ad soyad</label><input id="fgName" autocomplete="name"></div>'+
    '<div class="field"><label for="fgUser">Kullanıcı adı</label><input id="fgUser" autocomplete="username" autocapitalize="none"></div>'+
    '<div class="field"><label for="fgNew">Yeni şifre</label><input id="fgNew" type="password" autocomplete="new-password" placeholder="En az 6 karakter"></div>'+
    '<div class="field"><label for="fgNew2">Yeni şifre (tekrar)</label><input id="fgNew2" type="password" autocomplete="new-password"></div>'+
    '<p class="form-error" id="fgErr" role="alert" hidden></p><div class="sheet-actions"><button class="btn btn-primary">Yeni şifreyi kaydet</button><button type="button" class="btn" data-act="closeSheet">Vazgeç</button></div></form>')
};
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const fn = A[b.dataset.act]; if(!fn) return;
  if(b.tagName==='BUTTON' && b.form && b.type!=='button' && b.dataset.act) e.preventDefault();
  fn(b, e);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(editing){ A.closeNote(); } else if(ov.innerHTML){ closeSheet(); } } });

document.addEventListener('submit', e=>{
  e.preventDefault();
  const f = e.target;
  if(f.id==='quickForm'){
    const inp = document.getElementById('quickInput'), v = inp.value.trim(); if(!v) return;
    const p = parseQuick(v); if(!p.title){ toast('Görevin adını da yaz'); return; }
    S.tasks.push({id:uid(),title:p.title,cat:p.cat,date:p.date,time:p.time,alarm:p.alarm,done:false,doneAt:null,repeat:p.repeat,spawned:false,sample:false});
    save(); render(); toast('Eklendi · '+dLabel(p.date)+(p.time?' '+p.time:''));
    const ni = document.getElementById('quickInput'); if(ni) ni.focus();
  }
  if(f.id==='taskForm'){
    const g = id => document.getElementById(id).value;
    const title = g('tfTitle').trim(); if(!title){ document.getElementById('tfTitle').focus(); return; }
    const date = g('tfDate') || todayY(), rp = g('tfRep');
    const repeat = rp==='daily'?{type:'daily'}:rp==='weekly'?{type:'weekly',wd:fromYmd(date).getDay()}:rp==='monthly'?{type:'monthly',md:fromYmd(date).getDate()}:null;
    let t = f.dataset.id ? findT(f.dataset.id) : null;
    if(!t){ t = {id:uid(),done:false,doneAt:null,spawned:false,sample:false}; S.tasks.push(t); }
    Object.assign(t, {title, date, cat:g('tfCat'), time:g('tfTime'), alarm:g('tfAlarm'), repeat}); t.sample = false;
    save(); closeSheet(); render(); toast('Kaydedildi');
  }
  if(f.id==='loginForm'){
    const reg = UI.loginTab==='kayit', user = (document.getElementById('lgUser').value||'').trim(), pass = document.getElementById('lgPass').value||'';
    const nameEl = document.getElementById('lgName'), name = nameEl ? (nameEl.value||'').trim() : '';
    const fail = m => { UI.loginErr = m; UI.lgUser = user; render(); if(nameEl){ const n=document.getElementById('lgName'); if(n) n.value = name; } scrollToForm(true); };
    if(!user){ fail('Kullanıcı adını yaz.'); return; }
    if(pass.length<6){ fail('Şifre en az 6 karakter olmalı.'); return; }
    (async()=>{
      if(reg){
        if(S.user && S.user.pass){ fail('Bu cihazda zaten bir hesap var. "Giriş yap" ile gir.'); return; }
        S.user = {name: name||user, username: user}; await setPassword(pass);
      } else if(S.user.pass){
        if(lowTr(user)!==lowTr(String(S.user.username||'')) || !(await checkPassword(pass))){ fail('Kullanıcı adı ya da şifre hatalı.'); return; }
      } else {
        if(user!==S.user.username) S.user = {name:user, username:user};
        await setPassword(pass);
      }
      S.loggedIn = true; UI.loginErr = ''; UI.lgUser = ''; save(); go('bugun');
      toast(reg ? 'Hesap oluşturuldu, hoş geldin' : 'Hoş geldin, '+firstName());
    })();
  }
  if(f.id==='accForm'){
    const n = document.getElementById('acName').value.trim(), u = document.getElementById('acUser').value.trim(), er = document.getElementById('acErr');
    const show = m => { er.textContent = m; er.hidden = false; };
    if(!u){ show('Kullanıcı adı boş olamaz.'); return; }
    if(/\s/.test(u)){ show('Kullanıcı adında boşluk olmasın.'); return; }
    S.user.name = n || u; S.user.username = u; save(); closeSheet(); render(); toast('Hesap bilgileri güncellendi');
  }
  if(f.id==='pwForm'){
    (async()=>{
      const er = document.getElementById('pwErr'), show = m => { er.textContent = m; er.hidden = false; };
      const o = (document.getElementById('pwOld')||{}).value||'', n = document.getElementById('pwNew').value, n2 = document.getElementById('pwNew2').value;
      if(S.user.pass && !(await checkPassword(o))){ show('Mevcut şifre yanlış.'); return; }
      if(n.length<6){ show('Yeni şifre en az 6 karakter olmalı.'); return; }
      if(n!==n2){ show('Yeni şifreler birbirini tutmuyor.'); return; }
      await setPassword(n); save(); closeSheet(); render(); toast('Şifren değiştirildi');
    })();
  }
  if(f.id==='fgForm'){
    (async()=>{
      const er = document.getElementById('fgErr'), show = m => { er.textContent = m; er.hidden = false; };
      const nm = document.getElementById('fgName').value.trim(), u = document.getElementById('fgUser').value.trim(), n = document.getElementById('fgNew').value, n2 = document.getElementById('fgNew2').value;
      if(lowTr(u)!==lowTr(String(S.user.username||'')) || lowTr(nm)!==lowTr(String(S.user.name||''))){ show('Ad soyad ya da kullanıcı adı hesaptakiyle eşleşmedi.'); return; }
      if(n.length<6){ show('Yeni şifre en az 6 karakter olmalı.'); return; }
      if(n!==n2){ show('Yeni şifreler birbirini tutmuyor.'); return; }
      await setPassword(n); save(); closeSheet(); UI.loginErr = ''; UI.lgUser = S.user.username; UI.loginTab = 'giris'; render(); scrollToForm(true); toast('Yeni şifren kaydedildi, giriş yapabilirsin');
    })();
  }
});
document.addEventListener('input', e=>{
  const id = e.target.id;
  if(id==='quickInput'){ const v=e.target.value.trim(); document.getElementById('quickPreview').innerHTML = previewHTML(v?parseQuick(v):null); }
  if(id==='noteQ'){ UI.noteQ = e.target.value; document.getElementById('noteList').innerHTML = notesListHTML(); }
  if(id==='archQ'){ UI.archQ = e.target.value; document.getElementById('archList').innerHTML = archListHTML(); }
  if(id==='edTitle' || id==='edBody'){ const st=document.getElementById('edStat'); if(st) st.textContent = wordStat((document.getElementById('edBody')||{}).value||''); clearTimeout(saveTimer); saveTimer = setTimeout(saveEditing, 400); }
});
document.addEventListener('change', e=>{
  const id = e.target.id;
  if(id==='leadSel'){ S.settings.lead = +e.target.value; save(); toast('Alarm: görevden '+S.settings.lead+' dk önce'); }
  if(id==='mornIn'){ S.settings.morning = e.target.value; save(); }
  if(id==='edFolder'){ saveEditing(); }
});

(function(){ const h = (location.hash||'').replace('#',''); if(['bugun','takvim','notlar','arsiv','profil'].indexOf(h)>=0) UI.view = h; })();
try{ if(!IN_CLAUDE && 'serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
render();
checkAlarms();
})();
</script>
